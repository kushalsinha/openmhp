<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">The OpenMHP gateway: lab PCs dial out, agents dial in, nothing enters the lab</title>
  <desc id="desc">Three zones. On the left, the lab network behind a firewall: bench PCs running mhp node, each serving its instruments, connecting outward over HTTPS to the gateway. In the middle, the company network with one mhp gateway process at one address and port, with a node face, an agent face and a directory. On the right, agent machines: an office laptop and a home laptop on the VPN, both reaching the gateway with an agent token. Every arrow points at the gateway; no arrow enters the lab.</desc>
  <style>
    :root{--bg:#edf1ef;--grid:#dbe2de;--card:#f8faf9;--line:#c7d1cc;--ink:#172126;--mute:#63737a;--green:#087665;--green-bg:#dcefe9;--amber:#a9600d;--amber-bg:#f7e8d2;--wire:#84958e}
    @media(prefers-color-scheme:dark){:root{--bg:#171d20;--grid:#252e31;--card:#1e272a;--line:#354246;--ink:#e6ece9;--mute:#93a19c;--green:#4bc1a5;--green-bg:#17332d;--amber:#e5a14b;--amber-bg:#38291a;--wire:#84958e}}
    text{font-family:"Instrument Sans","Helvetica Neue",Arial,sans-serif;fill:var(--ink)}
    .section{font-size:17px;font-weight:700;letter-spacing:2.2px;fill:var(--mute)}
    .title{font-size:19px;font-weight:700}.sub{font-size:15px;fill:var(--mute)}
    .micro{font-size:13px;fill:var(--mute)}.flow{font-size:13px;fill:var(--mute)}
    .mono{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:13.5px}
    .card{fill:var(--card);stroke:var(--line)}
  </style>
  <defs>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0H0V46" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--wire)"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="538" rx="18" fill="var(--bg)" stroke="var(--line)"/>
  <rect x="1" y="1" width="1198" height="538" rx="18" fill="url(#grid)"/>

  <!-- lab network -->
  <text class="section" x="32" y="58">LAB NETWORK</text>
  <g>
    <rect class="card" x="32" y="82" width="330" height="118" rx="10"/>
    <text class="title" x="52" y="112">Bench PC 1</text>
    <text class="mono" x="52" y="138">mhp node C:\lab\devices</text>
    <text class="sub" x="52" y="162">thermocycler · balance · pump</text>
    <text class="micro" x="52" y="184">serves them locally, as on any LAN</text>

    <rect class="card" x="32" y="222" width="330" height="118" rx="10"/>
    <text class="title" x="52" y="252">Bench PC 2</text>
    <text class="mono" x="52" y="278">mhp node ~/.openmhp/devices</text>
    <text class="sub" x="52" y="302">HPLC · plate reader</text>
    <text class="micro" x="52" y="324">no AI agent on it, ever</text>

    <text class="sub" x="32" y="384">Nothing here listens for the outside.</text>
    <text class="sub" x="32" y="406">Each PC connects out and asks for work.</text>
  </g>

  <!-- firewall -->
  <g stroke="var(--amber)" stroke-width="1.5" stroke-dasharray="6 5" fill="none" opacity="0.9">
    <path d="M430 76V446"/>
  </g>
  <text class="micro" x="430" y="60" text-anchor="middle" font-weight="700" letter-spacing="1.5" fill="var(--amber)">LAB FIREWALL</text>
  <text class="micro" x="430" y="466" text-anchor="middle">no inbound rule</text>
  <text class="micro" x="430" y="482" text-anchor="middle">outbound HTTPS only</text>

  <!-- gateway -->
  <text class="section" x="640" y="58" text-anchor="middle">COMPANY NETWORK</text>
  <g>
    <rect x="490" y="82" width="300" height="340" rx="16" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
    <rect x="610" y="100" width="60" height="56" rx="16" fill="var(--green)"/>
    <text x="640" y="136" text-anchor="middle" font-size="18" font-weight="700" style="fill:#fff">MHP</text>
    <text x="640" y="188" text-anchor="middle" font-size="24" font-weight="700">Gateway</text>
    <text class="mono" x="640" y="212" text-anchor="middle">mhp gateway serve</text>
    <text x="640" y="238" text-anchor="middle" font-size="15" fill="var(--mute)">one address · one port · HTTPS</text>

    <rect x="508" y="256" width="264" height="42" rx="8" fill="var(--card)" stroke="var(--line)"/>
    <text class="mono" x="520" y="274">/relay/*</text><text class="micro" x="520" y="290">node face: bench PCs register and poll</text>
    <rect x="508" y="306" width="264" height="42" rx="8" fill="var(--card)" stroke="var(--line)"/>
    <text class="mono" x="520" y="324">/&lt;node&gt;/&lt;device&gt;/rpc · events</text><text class="micro" x="520" y="340">agent face: the usual device URLs</text>
    <rect x="508" y="356" width="264" height="42" rx="8" fill="var(--card)" stroke="var(--line)"/>
    <text class="mono" x="520" y="374">/directory/</text><text class="micro" x="520" y="390">every instrument of every lab PC</text>

    <text class="micro" x="640" y="444" text-anchor="middle">pairs lab PCs · issues agent tokens</text>
    <text class="micro" x="640" y="460" text-anchor="middle">forwards once or not at all</text>
  </g>

  <!-- agent machines -->
  <text class="section" x="1168" y="58" text-anchor="end">AGENT MACHINES</text>
  <g>
    <rect class="card" x="868" y="82" width="300" height="118" rx="10"/>
    <text class="title" x="888" y="112">Office laptop</text>
    <text class="sub" x="888" y="138">Claude Code · Codex · any harness</text>
    <text class="mono" x="888" y="162">mhp-mcp --directory https://gw…</text>
    <text class="micro" x="888" y="184">same mhp_find, mhp_read, mhp_invoke</text>

    <rect class="card" x="868" y="222" width="300" height="118" rx="10"/>
    <text class="title" x="888" y="252">Home laptop</text>
    <rect x="1098" y="235" width="52" height="24" rx="12" fill="var(--amber-bg)"/>
    <text x="1124" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--amber)">VPN</text>
    <text class="sub" x="888" y="278">VPN up = on the company network</text>
    <text class="mono" x="888" y="302">same URL, same token</text>
    <text class="micro" x="888" y="324">the gateway is where it always was</text>

    <text class="sub" x="1168" y="384" text-anchor="end">One token per agent machine.</text>
    <text class="sub" x="1168" y="406" text-anchor="end">One directory URL for the whole lab.</text>
  </g>

  <!-- wires: everything points at the gateway -->
  <g stroke="var(--wire)" stroke-width="2" fill="none">
    <path d="M362 141H480" marker-end="url(#arrow)"/>
    <path d="M362 281H480" marker-end="url(#arrow)"/>
    <path d="M868 141H800" marker-end="url(#arrow)"/>
    <path d="M868 281H800" marker-end="url(#arrow)"/>
  </g>
  <text class="flow" x="396" y="130" text-anchor="middle">dials out</text>
  <text class="flow" x="396" y="270" text-anchor="middle">long-polls</text>
  <text class="flow" x="834" y="130" text-anchor="middle">agent token</text>
  <text class="flow" x="834" y="270" text-anchor="middle">HTTPS</text>

  <text class="sub" x="600" y="516" text-anchor="middle" font-weight="600">Every arrow points at the gateway. No arrow enters the lab.</text>
</svg>
