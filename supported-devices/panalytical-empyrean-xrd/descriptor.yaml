device:
  notes: >
    A Malvern Panalytical Empyrean or Aeris X-ray diffractometer run by Data Collector (Empyrean,
    X'Pert) or the Aeris Instrument Suite on its Windows PC, with a sample changer where fitted
    (Aeris 6- or 67-position, Empyrean changer). The package queues one scan per request by
    writing a job file into the folder the lab's job import reads from, waits for the .xrdml
    result in the results folder, and reports the scan's size, range, counting time and status.
    Data Collector moves the changer, opens the shutter and measures; the package never touches
    the instrument.

physical:
  automated_load: true
  notes: >
    Samples are in holders at numbered positions of the changer (6 or 67 on the Aeris, 15 or 45
    on an Empyrean changer). A handling robot or a belt can place a holder while the changer is
    idle (the Aeris is sold for belt and robot integration), but Data Collector writes the
    changer's state to no file, so no robot_access_ready signal is declared: coordinate loading
    with the person at the instrument. X-rays: the enclosure interlocks and the shutter are
    hardware, outside this package.

signals:
  - {name: connected, type: boolean, notes: True when config.json names the job folder (writable) and the results folder (exists).}
  - {name: queue_depth, type: integer, unit: 1, notes: Job files (*.xml) still waiting in the job folder, from this package or anyone else; the import removes a file once taken.}
  - {name: sample_changer_position, type: integer, unit: 1, nullable: true, notes: "Position of the scan this package is waiting on once its job was taken; null when idle or when the scan was queued without a position. It is the position requested, not a readback from the changer."}
  - {name: last_result, type: object, nullable: true, notes: Result of the most recent queue_scan from here (same shape as its returns); null before the first.}
  - {name: state, type: string, source: runtime}
  - {name: busy, type: boolean, source: runtime, notes: True from writing the job file until the .xrdml appears or the wait times out.}
  - {name: calibration_status, type: string, source: record, notes: "From the lab's record (config.json self_state): the alignment and the Si/LaB6 standard checks live in Data Collector and are not read here."}
  - {name: calibration_due, type: string, source: record, nullable: true, notes: ISO-8601 date of the next alignment check due, from the lab's record; null when none is recorded.}
  - {name: qualification_status, type: string, source: record, notes: IQ/OQ/PQ as the lab records it.}
  - {name: usage_count, type: integer, source: record, notes: Scans queued from here (the lab's recorded count, or the number of finished queue_scan jobs when none is recorded).}

settings: []

actions:
  - name: queue_scan
    duration: long
    approval: confirm
    interlocks: [connected]
    methods: true
    cancellable: true
    notes: >
      Writes one job file (sample id, changer position, program file, scan axis, mode, start, end,
      step, time per step, result file name) and waits for <sample_id>_<token>.xrdml in the
      results folder. Confirm-gated because the import starts the changer and the shutter as soon
      as it takes the job. A saved method is the scan program per project; the caller passes the
      sample id and position. Cancelling before the job was taken removes the file; afterwards the
      measurement is stopped in Data Collector.
    params:
      sample_id: {type: string, notes: Names the result file (<sample_id>_<token>.xrdml) and is written as the XRDML sample id; letters, digits, underscore, hyphen, dot.}
      position: {type: integer, unit: 1, limits: {min: 1, max: 67}, nullable: true, notes: Changer position the holder sits in; null measures the holder already on the stage (no changer move). Also bounded by changer_positions in config.json.}
      program:
        type: object
        required: [start_2theta, end_2theta, step, time_per_step_s]
        notes: The scan program; a saved method carries one per project.
        properties:
          start_2theta: {type: number, unit: deg, limits: {min: 2, max: 142}, notes: Scan start on the 2theta axis; below 2 deg the direct beam reaches the detector. 142 deg is the Aeris upper limit; an Empyrean reaches 168 and the lab raises the bound.}
          end_2theta: {type: number, unit: deg, limits: {min: 2, max: 142}, notes: Must be above start_2theta.}
          step: {type: number, unit: deg, limits: {min: 0.001, max: 0.5}, notes: 2theta increment; 0.013 or 0.026 deg are usual on a PIXcel/1Der detector. 0.001 deg is the Aeris smallest addressable increment (0.0001 on an Empyrean).}
          time_per_step_s: {type: number, unit: s, limits: {min: 0.1, max: 100}, notes: "Counting time per step (XRDML commonCountingTime) as a point detector sees it; the duration check (points x time, bounded by max_scan_hours in config.json) assumes a point detector, so with a scanning detector set max_scan_hours for the counting time the program asks for."}
          mode: {type: string, limits: {enum: [continuous, pre_set_time]}, default: continuous, notes: "XRDML scan mode: Continuous (the usual powder scan) or Pre-set time (step scan)."}
          scan_axis: {type: string, limits: {enum: [Gonio, 2Theta, 2Theta-Omega]}, default: Gonio, notes: XRDML scanAxis; Gonio is the coupled Bragg-Brentano scan.}
          program_file: {type: string, nullable: true, notes: A .xrdmp measurement program in Data Collector's program folder that carries the optics, slits and detector settings; null lets the import use its default. Name only, no path.}
    required: [sample_id, program]
    returns:
      type: object
      required: [sample_id, file, points, two_theta_range, status, duration_s]
      properties:
        sample_id: {type: string}
        file: {type: string, notes: Full path of the .xrdml file.}
        points: {type: integer, notes: Intensity values read (first scan).}
        two_theta_range: {type: array, items: {type: number, unit: deg}, notes: "[start, end] of the 2Theta positions."}
        counting_time_s: {type: number, unit: s, nullable: true, notes: XRDML commonCountingTime; null when the scan lists per-point counting times.}
        status: {type: string, notes: "The scan's status attribute as written: Completed, Aborted or Not finished."}
        measurement_type: {type: string, nullable: true, notes: "xrdMeasurement measurementType (Scan, Repeated scan, ...)."}
        schema_version: {type: string, nullable: true, notes: XRDML schema version from the root namespace (1.5, 2.1, ...).}
        duration_s: {type: number, unit: s, notes: From writing the job file to the result file appearing.}
    examples:
      - sample_id: "batch12_formA"
        position: 2
        program: {start_2theta: 5, end_2theta: 60, step: 0.026, time_per_step_s: 0.5, mode: continuous, scan_axis: Gonio, program_file: null}

safety:
  estop: false
  interlocks: [connected]
  watchdog_s: 900
  watchdog_action: release
  notes: >
    X-ray safety is hardware: the enclosure interlocks and the shutter are outside any software,
    and Data Collector's own Stop ends a measurement (it writes the file with status Aborted).
    An e-stop here removes job files this package queued that the import has not taken yet and
    fails the waiting job; a scan already started continues in Data Collector. A controller
    silent for 15 minutes loses its lease and the scan finishes: interrupting it is worse than
    completing it, and the window must outlast the changer cycle and a slow scan.
