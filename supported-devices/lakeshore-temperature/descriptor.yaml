device:
  notes: >
    Lake Shore 335/336/350 temperature controller, the PID box beside a cryostat. Inputs A and
    B are cryogenic sensors read in kelvin; output 1 is the main heater with a setpoint, a
    heater range (the power ceiling) and an optional setpoint ramp. The heater range is the
    setting that matters for safety: a lab sets the range and setpoint limits to its own
    cryostat and heater before anything runs.

physical:
  automated_load: false
  notes: >
    Half-rack bench instrument wired to the cryostat's sensor and heater leads. Nothing is
    loaded into it; the sample sits in the cryostat, not in this instrument. Heater outputs:
    335 up to 75 W, 336 up to 100 W, 350 up to 75 W on output 1, into a resistive heater a
    person has sized.

signals:
  - name: temperature_a
    type: number
    unit: K
    notes: Sensor on input A in kelvin (KRDG? A). Reads 0 when the input is off or the sensor is open or over-range; check the front panel.
  - name: temperature_b
    type: number
    unit: K
    notes: Sensor on input B in kelvin (KRDG? B); 0 when not configured.
  - name: setpoint_1_actual
    type: number
    unit: K
    notes: Control setpoint of output 1 as the instrument holds it (SETP? 1); while ramping it moves toward the written setpoint_1.
  - name: setpoint_2_actual
    type: number
    unit: K
    notes: Control setpoint of output 2 (SETP? 2).
  - name: heater_output_1
    type: number
    unit: "%"
    notes: Output 1 heater drive as a percentage of the selected range (HTR? 1). 100 % with no temperature rise means the range is too low or the heater is open.
  - name: heater_output_2
    type: number
    unit: "%"
    notes: Output 2 heater drive in percent (HTR? 2); on a 335 whose output 2 is an analog output this is the output level.
  - name: heater_range_1
    type: integer
    notes: Heater range of output 1 as the instrument reports it (RANGE? 1); 0 off, 1 low, 2 medium, 3 high.
  - name: heater_range_2
    type: integer
    notes: Heater range of output 2 (RANGE? 2); 0 off, then low/medium/high (335/336 output 2 as a heater has 0 to 3; some configurations only 0 to 1).
  - name: ramp_enabled_1
    type: boolean
    notes: True when the setpoint of output 1 ramps rather than steps (first field of RAMP? 1).
  - name: ramp_rate_1_actual
    type: number
    unit: K/min
    notes: Setpoint ramp rate of output 1 in K/min (second field of RAMP? 1).
  - name: output_mode_1
    type: string
    notes: "OUTMODE? 1 reply 'mode,input,powerup': mode 0 off, 1 closed loop PID, 2 zone, 3 open loop; input 1 is A, 2 is B."
  - name: state
    type: string
    source: runtime
    notes: "The driver's state machine: idle, busy, fault, estop; answered by the base."
  - name: busy
    type: boolean
    source: runtime
    notes: True while a job started here is running; answered by the base.
  - name: connected
    type: boolean
    source: runtime
    notes: True while the socket, VISA session or serial port is open; interlock of every action.
  - name: calibration_status
    type: string
    source: record
    notes: valid, due, overdue or unknown, derived from the calibration_due date in the lab's config.json self_state record; the sensor calibration curves loaded in the controller are not read.
  - name: calibration_due
    type: string
    nullable: true
    source: record
    notes: ISO-8601 date the next calibration is due, from the lab's record; null when none is recorded.
  - name: qualification_status
    type: string
    source: record
    notes: qualified, unqualified or unknown, as the lab recorded it in config.json self_state.
  - name: usage_count
    type: integer
    source: record
    notes: Temperature-change jobs (go_to_temperature) completed from here, or the lab's recorded count.

settings:
  - name: setpoint_1
    type: number
    unit: K
    limits: {min: 4, max: 400}
    resolution: 0.001
    approval: auto
    during_job: true
    notes: >
      Control setpoint of output 1 in kelvin (SETP 1,<v>), applied at once, or walked to at
      ramp_rate_1 when ramping is on. Placeholder limits 4 to 400 K: the lab sets max to the
      highest temperature its sample mount, windows and heater are rated for. May change while
      a go_to_temperature job runs.
  - name: setpoint_2
    type: number
    unit: K
    limits: {min: 4, max: 400}
    resolution: 0.001
    approval: auto
    notes: Control setpoint of output 2 in kelvin (SETP 2,<v>); same placeholder limits.
  - name: heater_range_1
    type: integer
    limits: {min: 0, max: 3}
    approval: auto
    notes: >
      Heater range of output 1 (RANGE 1,<n>): 0 off, 1 low, 2 medium, 3 high. Each step is
      ten times the power of the one below. Approval cannot depend on the value, so the high
      range is not confirm-gated by itself; a lab that wants a person on range 3 sets max 2
      here or approval: confirm. Low is enough for most small cryostats below 100 K.
  - name: heater_range_2
    type: integer
    limits: {min: 0, max: 3}
    approval: auto
    notes: Heater range of output 2 (RANGE 2,<n>). Set max to 1 when output 2 is a 1 W heater or an analog output.
  - name: ramp_rate_1
    type: number
    unit: K/min
    limits: {min: 0.1, max: 100}
    resolution: 0.1
    approval: auto
    notes: >
      Writing a rate turns setpoint ramping on at that rate (RAMP 1,1,<rate>); subsequent
      setpoint_1 writes walk to the target. Invoke set_ramp_1 with enabled 0 to step instead.
      0.1 to 100 K/min is the instrument's range; 1 K/min is gentle on a sample mount.

actions:
  - name: go_to_temperature
    duration: long
    approval: auto
    interlocks: [connected]
    cancellable: true
    params:
      setpoint: {type: number, unit: K, limits: {min: 4, max: 400}, resolution: 0.001, notes: Target in kelvin for output 1; same placeholder limits as setpoint_1.}
      heater_range: {type: integer, limits: {min: 0, max: 3}, default: 1, notes: "Range to select after the setpoint: 0 off, 1 low (default), 2 medium, 3 high."}
    required: [setpoint]
    returns: {type: object, properties: {replies: {type: array, items: {type: string}}}}
    examples:
      - {setpoint: 77.0, heater_range: 1}
      - {setpoint: 300.0, heater_range: 2}
    notes: >
      Writes SETP 1 then RANGE 1 and returns: it does not wait for the temperature to arrive.
      Poll temperature_a against setpoint_1_actual afterwards. The replies are empty strings
      because Lake Shore commands do not answer.
  - name: set_ramp_1
    duration: short
    approval: auto
    interlocks: [connected]
    params:
      enabled: {type: integer, limits: {min: 0, max: 1}, default: 1, notes: 1 ramps the setpoint, 0 steps it.}
      rate: {type: number, unit: K/min, limits: {min: 0.1, max: 100}, resolution: 0.1, default: 1.0, notes: Ramp rate in K/min; the instrument stores it even when ramping is off.}
    examples:
      - {enabled: 1, rate: 2.0}
      - {enabled: 0, rate: 1.0}
    notes: RAMP 1,<enabled>,<rate>. The command always carries a rate, so turning ramping off restates one.
  - name: heaters_off
    duration: short
    approval: auto
    interlocks: [connected]
    notes: RANGE 1,0 and RANGE 2,0, the same commands the e-stop sends, without latching the e-stop state.

safety:
  estop: true
  interlocks: [connected]
  watchdog_s: 60
  notes: >
    E-stop sends RANGE 1,0 and RANGE 2,0: all heaters off. The setpoint is left as it was, so
    safety/reset followed by writing a heater range resumes control. The cryostat cools
    passively after a stop; nothing here can overheat once the heaters are off. The 60 s
    watchdog is longer than a bench instrument's because a cryostat changes temperature over
    minutes and a lost controller does no harm in a minute. No hardware stop on the instrument;
    the power switch is the physical one.

scpi:
  resource: "TCPIP0::192.168.1.30::7777::SOCKET"
  eol: "\r\n"
  timeout: 1
  idn_match: LSCI
  read:
    temperature_a: "KRDG? A"
    temperature_b: "KRDG? B"
    setpoint_1_actual: "SETP? 1"
    setpoint_2_actual: "SETP? 2"
    heater_output_1: "HTR? 1"
    heater_output_2: "HTR? 2"
    heater_range_1: "RANGE? 1"
    heater_range_2: "RANGE? 2"
    ramp_enabled_1: "RAMP? 1"
    ramp_rate_1_actual: "RAMP? 1"
    output_mode_1: "OUTMODE? 1"
  write:
    setpoint_1: "SETP 1,{value}"
    setpoint_2: "SETP 2,{value}"
    heater_range_1: "RANGE 1,{value}"
    heater_range_2: "RANGE 2,{value}"
    ramp_rate_1: "RAMP 1,1,{value}"
  actions:
    go_to_temperature: ["SETP 1,{setpoint}", "RANGE 1,{heater_range}"]
    set_ramp_1: ["RAMP 1,{enabled},{rate}"]
    heaters_off: ["RANGE 1,0", "RANGE 2,0"]
  estop: ["RANGE 1,0", "RANGE 2,0"]
  parse:
    ramp_enabled_1: {field: 1}
    ramp_rate_1_actual: {field: 2}
