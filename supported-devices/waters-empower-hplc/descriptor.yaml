device:
  notes: >
    Analytical HPLC/UPLC under Empower 3. Runs injection sample sets through the Empower Web API on
    one node and chromatographic system. Empower keeps methods, audit trail and results.

physical:
  automated_load: true
  notes: The sample manager's autosampler trays (vial positions such as '1:A,1') can be loaded by a handling system between sample sets. Solvent delivery up to the system's pressure limit (set in the instrument method). Flammable and toxic mobile phases.

signals:
  - {name: connected, type: boolean, notes: True when the Empower Web API accepts this package's login.}
  - {name: system_status, type: object, notes: "Empower's status entries for the configured node and system (name: value)."}
  - {name: state, type: string, source: runtime}
  - {name: busy, type: boolean, notes: True while a sample set started here is running.}
  - {name: robot_access_ready, type: boolean, source: instrument, notes: "True exactly when no sample set from here is running (not busy): a handling system may then load or unload vials in the autosampler trays. The sample manager's own door and tray sensors are not read through the Web API, so a sample set started from Empower itself is not seen; check system_status too."}
  - {name: last_result, type: object, notes: Result of the most recent run_samples from here; same shape as its returns.}
  - {name: calibration_status, type: string, source: record, notes: From the lab's record (config.json self_state); Empower's system suitability results are not read.}
  - {name: calibration_due, type: string, source: record, nullable: true, notes: ISO-8601 date of the next calibration due, from the lab's record; null when none is recorded.}
  - {name: qualification_status, type: string, source: record, notes: IQ/OQ/PQ as the lab records it.}
  - {name: usage_count, type: integer, source: record, notes: Sample sets run from here (the lab's recorded count, or the number of finished run_samples jobs when none is recorded); Empower's own injection counter is not read.}

settings: []

actions:
  - name: list_methods
    duration: short
    approval: auto
    interlocks: [connected]
    notes: Lists the project's instrument methods, method sets and sample set methods, and the plate types Empower knows.
  - name: run_samples
    duration: long
    approval: auto
    interlocks: [connected]
    methods: true
    params:
      samples:
        type: array
        notes: One entry per sample; a sample with injections > 1 becomes that many sample set lines.
        items:
          type: object
          required: [name, vial, injection_volume_ul, method]
          properties:
            name: {type: string}
            vial: {type: string, notes: "Empower vial position, e.g. '1:A,1'"}
            injection_volume_ul: {type: number, unit: uL, limits: {min: 0.1, max: 100}, notes: Also checked against this system's range in config.json.}
            method: {type: string, notes: Empower method set to inject with.}
            injections: {type: integer, limits: {min: 1, max: 10}, default: 1}
      plates:
        type: object
        nullable: true
        notes: "{plate position: plate type}. Omitted or null uses the plates in config.json; the result reports which were used."
      run_mode: {type: string, limits: {enum: [RunOnly, RunAndProcess, RunAndReport]}, default: RunAndProcess}
      sample_set_name: {type: string, nullable: true, notes: Omitted or null names it after the job; the result reports the name.}
      audit_comment: {type: string, nullable: true, notes: Omitted or null records the OpenMHP job id.}
    required: [samples]
    notes: >
      Creates a sample set method from the samples, starts it on the configured node and system,
      and follows the system status until it is idle. Each sample's injection volume and count are
      checked against the limits in config.json before anything is written to Empower.
    returns:
      type: object
      required: [sample_set_method, sample_set_name, run_mode, plates, injections, samples, final_status, elapsed_s, exported_rows]
      properties:
        sample_set_method: {type: string, notes: Name of the sample set method written to Empower (mhp_<date>_<job>).}
        sample_set_name: {type: string, notes: The sample set as named in Empower.}
        run_mode: {type: string}
        plates: {type: object, notes: "{plate position: plate type} actually used."}
        injections: {type: integer, notes: Sample set lines run (one per injection).}
        samples: {type: integer, notes: Entries in the samples parameter.}
        final_status: {type: object, notes: "Empower's status entries for the node and system when the run finished (name: value)."}
        elapsed_s: {type: number, unit: s}
        exported_rows: {type: array, items: {type: object}, notes: Rows of the result files written to export_dir during the run (columns as the export method names them, plus file); empty when no export folder is configured.}
    examples:
      - samples: [{name: "std_1", vial: "1:A,1", injection_volume_ul: 5, method: "Assay_C18"},
                  {name: "batch12_t30", vial: "1:A,2", injection_volume_ul: 5, method: "Assay_C18", injections: 2}]
        run_mode: RunAndProcess

safety:
  estop: false
  interlocks: [connected]
  watchdog_s: 300
  watchdog_action: release
  notes: No remote stop through the Web API calls used here. A person stops a run in Empower Run Samples; the instrument method's own pressure limits protect the column. A controller silent for 5 minutes loses its lease; the sample set keeps running.
