device:
  notes: Raman spectrometer with an immersion/window probe. Returns band intensities, and saves full spectra to disk.

physical:
  automated_load: false
  notes: Class 3B laser at the probe tip. Eye hazard if the probe is out of the cell or the beam path is open.

signals:
  - {name: connected, type: boolean, notes: True when the spectrometer answers on USB.}
  - {name: state, type: string, source: runtime, notes: "The driver's state machine: idle, busy, estop, fault."}
  - {name: busy, type: boolean, source: runtime, notes: True while an acquisition job started here is active.}
  - {name: laser_enabled, type: boolean, notes: True while the laser is firing.}
  - {name: detector_temperature, type: number, unit: Cel, nullable: true, notes: Null if the model has no cooled detector.}
  - {name: last_spectrum, type: object, notes: "Pushed after every spectrum: time, band intensities, maximum counts, saturated, laser state."}
  - {name: calibration_status, type: string, source: record, notes: "valid, due, overdue or unknown, from the lab's record (config.json self_state); wavenumber calibration is checked by a person against a reference, not reported by the spectrometer."}
  - {name: calibration_due, type: string, nullable: true, source: record, notes: ISO-8601 date the next calibration is due; null when the lab has not recorded one.}
  - {name: qualification_status, type: string, source: record, notes: "qualified, unqualified or unknown, as the lab records it."}
  - {name: usage_count, type: integer, source: record, notes: Acquisition jobs completed here (an acquire_series counts once), unless the lab's record carries its own count.}

settings:
  - name: integration_time_ms
    type: integer
    unit: ms
    limits: {min: 10, max: 30000}
    approval: auto
    during_job: false
    notes: Exposure per scan. The paper used 5000 ms.
  - name: scans_to_average
    type: integer
    limits: {min: 1, max: 20}
    approval: auto
    notes: Scans averaged into one spectrum.
  - name: laser_power_percent
    type: integer
    unit: "%"
    limits: {min: 1, max: 100}
    approval: confirm
    notes: PROVISIONAL. High power can heat or alter the catalyst surface; a person confirms a change.
  - name: laser_enable
    type: boolean
    approval: confirm
    notes: A person confirms the probe is seated in the cell before the laser is turned on. Turning it off also asks, so prefer leaving it on for a campaign; e-stop turns it off without asking.

actions:
  - name: acquire
    duration: short
    approval: auto
    interlocks: [connected]
    params:
      label: {type: string, nullable: true, notes: "A tag stored with the spectrum, e.g. the condition. Omitted or null stores no label."}
    returns:
      type: object
      properties:
        index: {type: integer, notes: Spectrum number within the job (0 for a single acquire).}
        t_s: {type: number, unit: s, notes: Time since the job started.}
        label: {type: string, nullable: true}
        bands: {type: object, notes: "Band centre in cm-1 (as a string key) -> background-corrected intensity in counts; null where the band has no points on the axis."}
        max_counts: {type: number, notes: Highest count in the spectrum.}
        saturated: {type: boolean, notes: True when max_counts reaches the detector's saturation level.}
        laser_enabled: {type: boolean}
        integration_time_ms: {type: integer, unit: ms}
        file: {type: string, notes: Path of the full spectrum CSV (raman_shift_cm1, counts).}
    notes: One spectrum with the current settings. Returns band intensities and where the full spectrum was saved.
    examples:
      - {label: "OCP, flow on"}
  - name: acquire_series
    duration: long
    approval: auto
    interlocks: [connected]
    cancellable: true
    params:
      count: {type: integer, notes: Number of spectra.}
      interval_s: {type: number, unit: s, default: 0, notes: Wait between the start of spectra; 0 = back to back.}
      label: {type: string, nullable: true, notes: A tag stored with every spectrum. Omitted or null stores no label.}
    required: [count]
    limits:
      count: [1, 2000]
      interval_s: [0, 600]
    returns:
      type: object
      properties:
        count: {type: integer}
        label: {type: string, nullable: true}
        folder: {type: string, notes: Folder holding spectrum_NNNN.csv for every spectrum.}
        bands_csv: {type: string, notes: Path of the band-intensity table (t_s plus one column per band).}
        laser_enabled: {type: boolean}
        bands_first_quarter: {type: object, notes: "Band centre (string key) -> mean intensity over the first quarter of the series; null where no value was measurable."}
        bands_last_quarter: {type: object, notes: "Band centre (string key) -> mean intensity over the last quarter of the series."}
        series: {type: array, items: {type: object}, notes: "Rows of {t_s, <band>: intensity}; the full series up to 60 spectra, otherwise thinned to about 60 rows (bands_csv has all of them)."}
    notes: A time series, for following the catalyst through an electrolysis run. Each spectrum is pushed as last_spectrum.
    examples:
      - {count: 50, interval_s: 6, label: "pCO2R -150 mA/cm2"}

safety:
  estop: true
  interlocks: [connected]
  watchdog_s: 300
  watchdog_action: release
  notes: E-stop turns the laser off. The laser stays on through unattended runs once a person has enabled it, so five
    minutes of silence from the controller releases the lease and reports it; stopping the laser stays a decision.
