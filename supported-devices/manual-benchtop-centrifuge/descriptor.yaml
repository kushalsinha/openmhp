physical:
  automated_load: false
  notes: Operator-run; a person loads, balances and unloads the rotor. Nothing here can be loaded by a handling system.
signals:
  - {name: balanced, type: boolean, notes: A person confirms tubes are balanced within 0.1 g.}
  - {name: state, type: string, source: runtime}
  - {name: busy, type: boolean, source: runtime, notes: True while a spin requested from here is in progress.}
  - {name: door_open, type: boolean}
  - {name: actual_speed, type: number, unit: "{rev}/min", notes: Read off the display by the operator.}
settings:
  - {name: speed, type: number, unit: "{rev}/min", limits: {min: 100, max: 15000}, approval: auto}
  - {name: duration_s, type: number, unit: s, limits: {min: 5, max: 3600}, approval: auto}
actions:
  - {name: spin, duration: long, approval: auto, interlocks: [balanced],
     returns: {type: object, required: [completed_by],
               properties: {completed_by: {type: string, notes: Who did the work; always "operator" on the real package.},
                            notes: {type: string, nullable: true, notes: Remarks the operator gave on acknowledge; null when none.}}},
     notes: The operator starts the run at the set speed and time and acknowledges when it has finished.}
  - {name: open_door, duration: short, approval: confirm, notes: Only after the rotor has stopped.}
safety:
  estop: false
  estop_kind: operator
  interlocks: [balanced]
  watchdog_s: null
  notes: Operator-run. Stopping is a request to the person at the instrument, who presses STOP; nothing stops
    automatically, and there is no action a watchdog could take, so this package declares none.
