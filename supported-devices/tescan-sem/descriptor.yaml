device:
  notes: >
    TESCAN floor-standing SEM (VEGA tungsten or LaB6 source; MIRA and CLARA Schottky field emission) with
    a five-axis motorised stage, SE and BSE detectors, high-vacuum and (on some models) low-vacuum modes,
    controlled from the microscope PC. SharkSEM is the remote-control TCP interface of that PC; this
    package is a template written against its shape, with every function name configurable. Stage
    positions in mm and degrees, view field in mm, high voltage in volts on the wire (kV here).

physical:
  automated_load: false
  notes: >
    The stub sits on the stage behind a hinged chamber door that a person opens by hand once the chamber
    is vented; no vendor loader or door actuator is documented for VEGA, MIRA or CLARA, so automated_load
    is false. A robot that can reach the open door reads robot_access_ready (vented, stage idle, nothing
    running) first. The stage is motorised in x, y, z, rotation and tilt and moves inside the chamber only.

signals:
  - {name: connected, type: boolean, notes: "True when the SharkSEM client connected to the microscope PC (host, port from config.json) and the vacuum status reads."}
  - {name: state, type: string, source: runtime}
  - {name: busy, type: boolean, source: runtime, notes: "True while a pump, vent, beam run-up, stage move or acquisition from here runs."}
  - {name: vacuum_status, type: string, notes: "SharkSEM vacuum status word passed through (VacGetStatus, unverified): ready, pumping, venting, vented, error as the twin models them; the real instrument's words are the manual's."}
  - {name: vacuum_ready, type: boolean, notes: "True when vacuum_status is the ready word (chamber at operating pressure); false while pumping, venting or vented."}
  - {name: beam_on, type: boolean, notes: "True when the high voltage is on and run up (HVGetBeam, unverified); the beam may still be blanked by the scan generator between acquisitions."}
  - {name: high_voltage, type: number, unit: kV, notes: "High voltage reported by the instrument (HVGetVoltage, unverified; volts on the wire, kV here)."}
  - {name: stage_position, type: object, notes: "{x_mm, y_mm, z_mm, rotation_deg, tilt_deg} from StgGetPosition (unverified)."}
  - {name: stage_busy, type: boolean, notes: "True while the stage moves (StgIsBusy, unverified)."}
  - {name: robot_access_ready, type: boolean, source: instrument, notes: "True exactly when vacuum_status is vented, the stage is idle and nothing from here runs: the door may be opened and the stub exchanged. There is no door switch in the protocol shape read, so this does not know whether the door is actually open."}
  - {name: last_image, type: object, nullable: true, notes: "Result of the most recent acquire_image from here; same shape as its returns; null before the first."}
  - {name: calibration_status, type: string, source: record, notes: "From the lab's record (config.json self_state); the instrument's own magnification calibration is not read."}
  - {name: calibration_due, type: string, source: record, nullable: true, notes: "ISO-8601 date of the next magnification calibration check due, from the lab's record; null when none is recorded."}
  - {name: qualification_status, type: string, source: record, notes: "IQ/OQ/PQ as the lab records it."}
  - {name: usage_count, type: integer, source: record, notes: "Images acquired from here (the lab's recorded count, or finished acquire_image jobs when none is recorded)."}

settings:
  - {name: high_voltage, type: number, unit: kV, limits: {min: 0.2, max: 30}, resolution: 0.01, approval: auto, during_job: false,
     notes: "Accelerating voltage for the next set_beam (HVSetVoltage, unverified; sent in volts). 0.2-30 kV is a placeholder for the VEGA/MIRA/CLARA families; set the limits to your column. Stored here and sent when the beam is switched on, or immediately if the beam is already on."}

actions:
  - name: load_sample
    duration: long
    approval: auto
    interlocks: [connected, robot_access_ready]
    cancellable: false
    notes: >
      Pumps the chamber (VacPump, unverified) after a person or robot has closed the door, and waits until
      the vacuum status is ready (typically 2-4 minutes on a VEGA). Needs robot_access_ready so the door was
      openable, which is the best this protocol shape can say about it being closed again. Not cancellable.
    returns:
      type: object
      required: [vacuum_status, vacuum_ready, duration_s]
      properties:
        vacuum_status: {type: string}
        vacuum_ready: {type: boolean}
        duration_s: {type: number, unit: s}
    examples:
      - {}
  - name: unload_sample
    duration: long
    approval: auto
    interlocks: [connected]
    cancellable: false
    notes: "Switches the high voltage off (HVBeamOff, unverified), waits for the stage to be idle, vents the chamber (VacVent, unverified) and waits for the vented word; robot_access_ready then reads true."
    returns:
      type: object
      required: [vacuum_status, vacuum_ready, beam_on, duration_s]
      properties:
        vacuum_status: {type: string}
        vacuum_ready: {type: boolean}
        beam_on: {type: boolean}
        duration_s: {type: number, unit: s}
    examples:
      - {}
  - name: set_beam
    duration: long
    approval: auto
    interlocks: [connected, vacuum_ready]
    cancellable: false
    params:
      enable: {type: boolean, notes: "True switches the high voltage on at the high_voltage setting (HVSetVoltage then HVBeamOn, unverified) and waits for the run-up; false switches it off (HVBeamOff)."}
    required: [enable]
    notes: "Beam on needs the chamber pumped (vacuum_ready interlock). Run-up takes 10-60 s depending on the source; the job returns when HVGetBeam reports on."
    returns:
      type: object
      required: [beam_on, high_voltage_kv, duration_s]
      properties:
        beam_on: {type: boolean}
        high_voltage_kv: {type: number, unit: kV}
        duration_s: {type: number, unit: s}
    examples:
      - {enable: true}
  - name: move_stage
    duration: long
    approval: auto
    interlocks: [connected, vacuum_ready]
    cancellable: true
    params:
      x_mm: {type: number, unit: mm, limits: {min: -40, max: 40}, resolution: 0.001, notes: "Stage X from centre; +/-40 mm is a placeholder for an 80 mm stage, set to your chamber."}
      y_mm: {type: number, unit: mm, limits: {min: -40, max: 40}, resolution: 0.001, notes: "Stage Y from centre."}
      z_mm: {type: number, unit: mm, limits: {min: 0, max: 40}, resolution: 0.001, nullable: true, default: null, notes: "Stage Z (working-distance direction); null keeps the current Z. Set the maximum below the pole-piece clearance for your tallest holder."}
      rotation_deg: {type: number, unit: deg, limits: {min: 0, max: 360}, resolution: 0.01, nullable: true, default: null, notes: "Stage rotation; null keeps it."}
      tilt_deg: {type: number, unit: deg, limits: {min: -30, max: 90}, resolution: 0.01, nullable: true, default: null, notes: "Stage tilt; null keeps it. Tilt with a tall holder can hit the pole piece: the lab sets the limit."}
    required: [x_mm, y_mm]
    notes: "Absolute move (StgMoveTo, unverified) followed by polling StgIsBusy; cancelling sends StgStop. The chamber must be pumped so a move is never made with the door open."
    returns:
      type: object
      required: [x_mm, y_mm, z_mm, rotation_deg, tilt_deg]
      properties:
        x_mm: {type: number, unit: mm}
        y_mm: {type: number, unit: mm}
        z_mm: {type: number, unit: mm}
        rotation_deg: {type: number, unit: deg}
        tilt_deg: {type: number, unit: deg}
    examples:
      - {x_mm: 5.0, y_mm: -3.5, z_mm: null, rotation_deg: null, tilt_deg: null}
  - name: auto_focus
    duration: short
    approval: auto
    interlocks: [connected, beam_on]
    notes: "Runs the automatic working-distance (focus) routine (AutoWD, unverified) at the current view field; a few seconds."
  - name: acquire_image
    duration: long
    approval: auto
    interlocks: [connected, vacuum_ready, beam_on]
    cancellable: true
    params:
      magnification: {type: number, unit: "1", limits: {min: 2, max: 1000000}, notes: "Requested magnification; converted to a view field in mm with the reference width in config.json (SetViewField, unverified). Placeholder range."}
      width_px: {type: integer, unit: "1", limits: {min: 256, max: 8192}, default: 1024, notes: "Image width in pixels (ScScanXY, unverified)."}
      height_px: {type: integer, unit: "1", limits: {min: 256, max: 8192}, default: 768, notes: "Image height in pixels."}
      scan_speed: {type: integer, unit: "1", limits: {min: 1, max: 10}, default: 5, notes: "TESCAN scan speed index 1 (fastest) to 10 (slowest); sets the pixel dwell (ScSetSpeed, unverified)."}
      frames: {type: integer, unit: "1", limits: {min: 1, max: 64}, default: 1, notes: "Frames to accumulate; the package acquires frames one after another and averages."}
      detector: {type: string, limits: {enum: [se, bse]}, default: se, notes: "Detector to select into channel 0 (DtSelect, DtEnable; unverified): se for the Everhart-Thornley, bse for the backscatter detector."}
      auto_focus: {type: boolean, default: false, notes: "Run AutoWD before acquiring."}
      label: {type: string, default: "image", notes: "Plain name used in the TIFF file name (letters, digits, dash, underscore)."}
    required: [magnification]
    notes: >
      Sets the view field, selects the detector, optionally focuses, starts a single frame scan and fetches
      the 8-bit image (FetchImage, unverified), averages the frames and writes a TIFF into image_dir. Cancelling
      between frames sends ScStopScan. The scan time is width x height x dwell per frame.
    returns:
      type: object
      required: [file, magnification, view_field_um, width_px, height_px, high_voltage_kv, scan_speed, frames, detector, stage, duration_s]
      properties:
        file: {type: string, notes: "Path of the TIFF written."}
        magnification: {type: number, unit: "1", notes: "Magnification computed from the view field the instrument reports back."}
        view_field_um: {type: number, unit: um}
        width_px: {type: integer}
        height_px: {type: integer}
        high_voltage_kv: {type: number, unit: kV}
        scan_speed: {type: integer}
        frames: {type: integer}
        detector: {type: string}
        stage:
          type: object
          required: [x_mm, y_mm, z_mm, rotation_deg, tilt_deg]
          properties:
            x_mm: {type: number, unit: mm}
            y_mm: {type: number, unit: mm}
            z_mm: {type: number, unit: mm}
            rotation_deg: {type: number, unit: deg}
            tilt_deg: {type: number, unit: deg}
        duration_s: {type: number, unit: s}
    examples:
      - {magnification: 2000, width_px: 1024, height_px: 768, scan_speed: 5, frames: 1, detector: se, auto_focus: true, label: "grain01"}
      - {magnification: 20000, width_px: 2048, height_px: 1536, scan_speed: 7, frames: 4, detector: bse, auto_focus: false, label: "grain01_bse"}

safety:
  estop: true
  interlocks: [connected, vacuum_ready, beam_on, robot_access_ready]
  watchdog_s: 60
  notes: >
    E-stop switches the high voltage off (HVBeamOff, unverified), stops the stage (StgStop) and stops any
    scan (ScStopScan); the chamber stays pumped and nothing vents. A controller silent for 60 s is stopped
    the same way. The microscope's own interlocks guard the door and the high voltage; there is no physical
    stop button on the column.
