name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# the suite only reads the repository; nothing here publishes, comments or releases.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[all]"

      - name: Run test suite
        # bash on every OS stops at the first failing script; Windows' default shell, pwsh,
        # would report only the exit code of the last one
        shell: bash
        run: |
          python tests/test_adapters.py
          python tests/test_runs.py
          python tests/test_safety_gates.py
          python tests/test_methods.py
