[project]
name = "openmhp"
version = "0.9.0"
description = "OpenMHP: reference implementation of the Open Model Hardware Protocol (MHP), an open protocol for AI agents to operate physical devices safely."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]
license = {text = "Apache-2.0"}
readme = "README.md"
authors = [{name = "Kushal Sinha", email = "kushal.sinha@kortana.io"}]
keywords = ["mcp", "agents", "laboratory", "instruments", "hardware", "robotics", "automation", "openmhp"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Developers", "Intended Audience :: Science/Research", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Topic :: Scientific/Engineering", "Topic :: System :: Hardware"]

[project.urls]
Homepage = "https://openmhp.com"
Repository = "https://github.com/kushalsinha/openmhp"
Documentation = "https://openmhp.com"
Issues = "https://github.com/kushalsinha/openmhp/issues"

[project.scripts]
mhp = "openmhp.cli:main"
mhp-mcp = "openmhp.mcp_bridge:main"
mhp-validate = "openmhp.validate:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
openmhp = ["skills/**/*", "devices/*/*", "devices/*/*/*", "recipes/*.py", "registry.json"]

[project.optional-dependencies]
discovery = ["zeroconf>=0.130"]
serial = ["pyserial>=3.5"]
mqtt = ["paho-mqtt>=2"]
all = ["zeroconf>=0.130", "pyserial>=3.5", "paho-mqtt>=2"]

[tool.setuptools.packages.find]
include = ["openmhp*"]
