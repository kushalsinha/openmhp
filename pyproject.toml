[project]
name = "openmhp"
version = "0.1.0"
description = "OpenMHP: reference implementation of the Open Model Hardware Protocol (MHP), an open protocol for AI agents to operate physical devices safely."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]
license = {text = "Apache-2.0"}

[project.scripts]
mhp = "openmhp.cli:main"
mhp-mcp = "openmhp.mcp_bridge:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["openmhp*"]
